name: resq_mobile
description: ResQ AI - Citizen Emergency Reporting App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4

  # Location & Maps
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0

  # Networking
  http: ^1.2.2

  # Audio recording (voice reports)
  record: ^7.1.1
  audioplayers: ^6.1.0

  # Image picking
  image_picker: ^1.1.2

  # State management
  provider: ^6.1.2

  # Utilities
  intl: ^0.19.0
  permission_handler: ^11.3.1
  uuid: ^4.5.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true


